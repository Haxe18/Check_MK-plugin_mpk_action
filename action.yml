name: Checkmk MKP Release
description: Build a Checkmk plugin as MKP package and publish it as GitHub release
branding:
  icon: package
  color: blue

inputs:
  plugin_name:
    description: "Name of the plugin directory"
    required: true
  title:
    description: "Title of the plugin"
    required: true
  description:
    description: "Description of the plugin"
    required: true
  tag_prefix:
    description: "Prefix of the tag to strip (e.g., 'v' for v1.0.0)"
    required: false
    default: "v"
  changelog_filter_path:
    description: "Path to filter git log for changelog (default: root)"
    required: false
    default: "."
  usable_until:
    description: "Checkmk version from which the package is disabled, e.g. '3.0.0' (default: no limit)"
    required: false
    default: ""
  github_token:
    description: "Token used to create the release"
    required: false
    default: ${{ github.token }}

outputs:
  mkp_file:
    description: "File name of the built MKP package"
    value: ${{ steps.build.outputs.mkp_file }}

runs:
  using: composite
  steps:
    - name: Define plugin variables
      id: vars
      shell: bash
      env:
        TAG_PREFIX: ${{ inputs.tag_prefix }}
      run: |
        echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
        echo "version=${GITHUB_REF_NAME#"$TAG_PREFIX"}" >> "$GITHUB_OUTPUT"

    # Inputs go through env, so quotes in them cannot break the shell line
    - name: Build MKP package
      id: build
      shell: bash
      env:
        INPUT_PLUGIN_NAME: ${{ inputs.plugin_name }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_DESCRIPTION: ${{ inputs.description }}
        PLUGIN_VERSION: ${{ steps.vars.outputs.version }}
        INPUT_USABLE_UNTIL: ${{ inputs.usable_until }}
      run: |
        "${GITHUB_ACTION_PATH}/scripts/build_plugin.sh" \
          --plugin-name "$INPUT_PLUGIN_NAME" \
          --title "$INPUT_TITLE" \
          --description "$INPUT_DESCRIPTION" \
          --version "$PLUGIN_VERSION" \
          --author "$GITHUB_ACTOR" \
          --git-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
          --usable-until "$INPUT_USABLE_UNTIL" \
          --ci
        echo "mkp_file=${INPUT_PLUGIN_NAME}-${PLUGIN_VERSION}.mkp" >> "$GITHUB_OUTPUT"

    - name: Generate changelog
      id: changelog
      shell: bash
      env:
        TAG_PREFIX: ${{ inputs.tag_prefix }}
        CURRENT_TAG: ${{ steps.vars.outputs.tag }}
        FILTER_PATH: ${{ inputs.changelog_filter_path }}
      run: |
        # Find previous tag matching the pattern
        PREVIOUS_TAG=$(git tag --list "${TAG_PREFIX}*" --sort=-version:refname | grep -v "$CURRENT_TAG" | head -n1 || echo "")

        if [ -z "$PREVIOUS_TAG" ]; then
          echo "No previous tag found. Generating changelog from all commits."
          CHANGELOG=$(git log --pretty=format:"- %s%w(0,4,4)%+b" --reverse -- "$FILTER_PATH")
        else
          echo "Generating changelog from $PREVIOUS_TAG to $CURRENT_TAG."
          CHANGELOG=$(git log --pretty=format:"- %s%w(0,4,4)%+b" "$PREVIOUS_TAG".."$CURRENT_TAG" --reverse -- "$FILTER_PATH")
        fi

        # Handle multiline output for GITHUB_OUTPUT
        {
          echo "changelog<<EOF"
          echo "$CHANGELOG"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ inputs.github_token }}
        tag_name: ${{ steps.vars.outputs.tag }}
        name: ${{ inputs.title }} ${{ steps.vars.outputs.version }}
        body: |
          ## ${{ inputs.title }} ${{ steps.vars.outputs.version }}

          ### Changes
          ${{ steps.changelog.outputs.changelog }}

          ### Installation
          ```bash
          mkp add ${{ steps.build.outputs.mkp_file }}
          mkp enable ${{ inputs.plugin_name }} ${{ steps.vars.outputs.version }}
          ```
        files: |
          ${{ steps.build.outputs.mkp_file }}
