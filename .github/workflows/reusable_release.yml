# Kept for plugin repos that still call this workflow. New setups use the
# action directly, see README.md.
name: Reusable Plugin Release

on:
  workflow_call:
    inputs:
      plugin_name:
        required: true
        type: string
        description: "Name of the plugin directory"
      title:
        required: true
        type: string
        description: "Title of the plugin"
      description:
        required: true
        type: string
        description: "Description of the plugin"
      tag_prefix:
        required: false
        type: string
        default: "v"
        description: "Prefix of the tag to strip (e.g., 'v' for v1.0.0)"
      changelog_filter_path:
        required: false
        type: string
        default: "."
        description: "Path to filter git log for changelog (default: root)"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout plugin code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and release
        uses: haxe18/Check_MK-plugin_mpk_action@main
        with:
          plugin_name: ${{ inputs.plugin_name }}
          title: ${{ inputs.title }}
          description: ${{ inputs.description }}
          tag_prefix: ${{ inputs.tag_prefix }}
          changelog_filter_path: ${{ inputs.changelog_filter_path }}
